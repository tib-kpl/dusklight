name: Build

on:
  push:
    branches: ['**']
  pull_request:
    paths-ignore:
      - '*.md'
      - '*LICENSE'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DUSK_RELEASE_VERSION: 0.1.${{ github.run_number }}
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  build-linux:
    name: Build Linux (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC x86_64
            runner: ubuntu-24.04
            preset: gcc
            artifact_arch: x86_64
          - name: GCC aarch64
            runner: ubuntu-24.04-arm
            preset: gcc
            artifact_arch: aarch64
          # - name: Clang x86_64
          #   runner: ubuntu-latest
          #   preset: clang
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang lld mold openssl libcurl4-openssl-dev \
            zlib1g-dev libglu1-mesa-dev libdbus-1-dev libvulkan-dev libxi-dev libxrandr-dev libasound2-dev \
            libpulse-dev libudev-dev libpng-dev libncurses5-dev libx11-xcb-dev libfreetype-dev \
            libxinerama-dev libxcursor-dev python3-markupsafe libgtk-3-dev libssl-dev \
            libxss-dev libfuse2 libusb-1.0-0-dev libdecor-0-dev libpipewire-0.3-dev libunwind-dev

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Print sccache stats
        run: sccache --show-stats

      - name: Configure CMake
        run: cmake --preset x-linux-ci-${{matrix.preset}} -DDUSK_RELEASE_VERSION=${{env.DUSK_RELEASE_VERSION}}

      - name: Build
        run: cmake --build --preset x-linux-ci-${{matrix.preset}}

      - name: Generate AppImage
        run: ci/build-appimage.sh

      - name: Package release
        run: |
          mkdir -p upload
          cp build/install/Dusklight-*.AppImage "upload/Dusklight-linux-${{matrix.artifact_arch}}.AppImage"
          extras=(debug.tar.xz)
          if [[ -d build/install/sdk ]]; then
            extras+=(sdk)
          fi
          tar -cJf "upload/Dusklight-linux-${{matrix.artifact_arch}}-debug.tar.xz" -C build/install "${extras[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-linux-${{matrix.preset}}-${{matrix.artifact_arch}}
          path: upload/
          if-no-files-found: error

  build-apple:
    name: Build Apple (${{matrix.name}})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AppleClang macOS arm64
            platform: macos
            preset: x-macos-ci-arm64
            artifact_name: macos-appleclang-arm64
          - name: AppleClang macOS x86_64
            platform: macos
            preset: x-macos-ci-x86_64
            artifact_name: macos-appleclang-x86_64
          - name: AppleClang iOS arm64
            platform: ios
            preset: x-ios-ci
            artifact_name: ios-appleclang-arm64
          # - name: AppleClang tvOS arm64
          #   platform: tvos
          #   preset: x-tvos-ci
          #   artifact_name: tvos-appleclang-arm64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      # The Command Line Tools linker always matches its own SDK.
      - name: "Use the Command Line Tools toolchain"
        if: matrix.platform == 'macos'
        run: sudo xcode-select -s /Library/Developer/CommandLineTools

      - name: Install dependencies
        run: brew install cmake ninja

      - name: Install Rust iOS target
        if: matrix.platform == 'ios'
        run: |
          rustup toolchain install stable
          rustup target add aarch64-apple-ios

      - name: Install Rust tvOS target
        if: matrix.platform == 'tvos'
        run: |
          rustup toolchain install nightly
          rustup target add --toolchain nightly aarch64-apple-tvos

      - name: Install Rust x86_64 macOS target
        if: endsWith(matrix.preset, 'x86_64')
        run: |
          rustup toolchain install stable
          rustup target add x86_64-apple-darwin

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}} -DDUSK_RELEASE_VERSION=${{env.DUSK_RELEASE_VERSION}}

      - name: Build
        run: cmake --build --preset ${{matrix.preset}}

      # Archive on macOS to preserve bundle symlinks and executable permissions.
      - name: Package release
        run: |
          mkdir -p upload
          tar -czf "upload/Dusklight-${{matrix.artifact_name}}.tar.gz" -C build/install .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-${{matrix.artifact_name}}
          path: upload/
          if-no-files-found: error

  build-android:
    name: Build Android (${{matrix.name}})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang arm64-v8a
            preset: x-android-ci-arm64
            abi: arm64-v8a
            artifact_arch: arm64
            rust_target: aarch64-linux-android

    env:
      ANDROID_NDK_VERSION: "29.0.14206865"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Install Rust Android target
        run: |
          rustup toolchain install stable
          rustup target add ${{matrix.rust_target}}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}} -DDUSK_RELEASE_VERSION=${{env.DUSK_RELEASE_VERSION}}

      - name: Build native library
        run: cmake --build --preset ${{matrix.preset}} --target dusklight

      - name: Build bundled mods
        run: cmake --build --preset ${{matrix.preset}} --target dusklight_mods

      - name: Build APK
        working-directory: platforms/android
        run: bash ./gradlew :app:assembleRelease

      - name: Stage artifacts
        run: |
          mkdir -p upload/sdk
          cp build/*/stub-android-*.so upload/sdk/
          cp platforms/android/app/build/outputs/apk/release/app-${{matrix.abi}}-release-unsigned.apk upload/Dusklight-android-${{matrix.artifact_arch}}-unsigned.apk
          tar -czf upload/Dusklight-android-${{matrix.artifact_arch}}-sdk.tar.gz -C upload sdk
          rm -r upload/sdk

      - name: Sign and verify APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: dusklight
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD repository secret}"
          keystore="$RUNNER_TEMP/dusklight-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unsigned="upload/Dusklight-android-${{matrix.artifact_arch}}-unsigned.apk"
          signed="upload/Dusklight-android-${{matrix.artifact_arch}}.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -P 16 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type PKCS12 \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$signed" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$signed"
          "$tools/zipalign" -c -P 16 4 "$signed"
          rm "$unsigned"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-android-${{matrix.artifact_arch}}
          path: upload/
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{matrix.name}})
    runs-on: ${{matrix.runner}}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC x86_64
            runner: windows-latest
            preset: msvc
            msvc_arch: amd64
            vcpkg_arch: x64
            artifact_arch: x86_64
          - name: MSVC arm64
            runner: windows-latest
            preset: arm64-msvc
            msvc_arch: amd64_arm64
            vcpkg_arch: arm64
            artifact_arch: arm64
          # - name: Clang x86_64
          #   runner: windows-latest
          #   preset: clang
          #   msvc_arch: amd64
          #   vcpkg_arch: x64
          #   artifact_arch: x86_64

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      # msvc-dev-cmd sets VCPKG_ROOT, set it back
      - name: Override VCPKG_ROOT
        run: echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install dependencies
        run: |
          choco install ninja
          vcpkg install freetype:${{matrix.vcpkg_arch}}-windows zstd:${{matrix.vcpkg_arch}}-windows

      - name: Configure CMake
        run: cmake --preset x-windows-ci-${{matrix.preset}} -DDUSK_RELEASE_VERSION=${{env.DUSK_RELEASE_VERSION}}

      - name: Build
        run: cmake --build --preset x-windows-ci-${{matrix.preset}}

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path upload -Force | Out-Null
          Compress-Archive -Path build/install/* -DestinationPath upload/Dusklight-windows-${{matrix.artifact_arch}}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dusklight-${{env.APP_VERSION}}-win32-msvc-${{matrix.artifact_arch}}
          path: upload/
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: [build-linux, build-apple, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: dusklight-*
          path: release
          merge-multiple: true

      - name: Publish packages for this commit
        shell: bash
        run: |
          set -euo pipefail
          tag="v$DUSK_RELEASE_VERSION"
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Dusklight $tag, compilation du commit $COMMIT_SHA.

          - Android ARM64 : APK signée et installable, interface en français.
          - Linux x86_64 et ARM64 : AppImage et SDK/symboles de débogage.
          - Windows x86_64 et ARM64 : archives ZIP avec ressources, mods et SDK.
          - macOS ARM64 et x86_64 : archives de l'application, des ressources et du SDK.
          - iOS ARM64 : application à signer avant installation sur un appareil.

          Vérifiez les téléchargements avec SHA256SUMS.txt.
          [Détails de la compilation]($RUN_URL).
          EOF
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT_SHA" --draft \
              --title "Dusklight $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$tag" ./* --clobber
          gh release edit "$tag" --draft=false --prerelease=false --latest \
            --notes-file "$RUNNER_TEMP/release-notes.md"
